# T0 checks: everything that runs on a laptop with no GPU.
name: t0
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r site/requirements.txt
      - run: python tools/check_links.py
      - run: python tools/build_site.py

  tests:
    # Exercises run against their reference solutions (S2S_SOLUTIONS=1); GPU tests skip; `slow` tests are opt-in.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: S2S_SOLUTIONS=1 uv run pytest -x -q

  tests-torch:
    # PyTorch on CPU: custom-op registration, the batched sampler, Triton interpreter mode.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra torch
      - run: S2S_SOLUTIONS=1 TRITON_INTERPRET=1 uv run pytest -m torch -q

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.9.8"}
      - run: bash tools/ci_terraform.sh
