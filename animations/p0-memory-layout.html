<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory layout explorer</title>
<style>/*CORE-CSS*/
:root{--bg:#ffffff;--fg:#1d2433;--muted:#5b6578;--panel:#f3f5f9;--line:#d5dbe5;--accent:#2563eb;--accent2:#d9480f;--ok:#2f9e44;--bad:#c92a2a;--warn:#e8a200;--cell:#e7ecf5;--cell2:#cfe0ff;--cell3:#ffd8c2;--cell4:#d3f9d8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151c;--fg:#e6e9ef;--muted:#9aa4b5;--panel:#1a2029;--line:#2e3846;--accent:#6ea8fe;--accent2:#ff922b;--ok:#69db7c;--bad:#ff6b6b;--warn:#ffd43b;--cell:#232b37;--cell2:#1f3a66;--cell3:#5c2e14;--cell4:#1f4d2a;}}
:root[data-theme="dark"]{--bg:#11151c;--fg:#e6e9ef;--muted:#9aa4b5;--panel:#1a2029;--line:#2e3846;--accent:#6ea8fe;--accent2:#ff922b;--ok:#69db7c;--bad:#ff6b6b;--warn:#ffd43b;--cell:#232b37;--cell2:#1f3a66;--cell3:#5c2e14;--cell4:#1f4d2a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:hidden}
.stage svg{width:100%;height:auto;display:block}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
label{display:flex;align-items:center;gap:6px;color:var(--muted)}
input[type=range]{width:120px}
.progress{flex:1 1 120px;height:6px;background:var(--line);border-radius:3px;min-width:80px}
.progress>div{height:100%;background:var(--accent);border-radius:3px;width:0}
.caption{min-height:3.2em;background:var(--panel);border-left:4px solid var(--accent);padding:8px 12px;border-radius:6px}
.extra{margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:.9rem;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
svg text{fill:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
svg .muted{fill:var(--muted)}
.kbd{font-family:ui-monospace,monospace;font-size:.85em;border:1px solid var(--line);border-radius:4px;padding:0 4px}
/*END-CORE-CSS*/</style>
</head>
<body>
<main>
<h1>Memory layout explorer</h1>
<p class="sub">P0.1 — struct padding byte by byte, then one buffer walked in row-major vs strided order with a tiny 4-line cache.</p>
<div class="stage"><svg id="svg" viewBox="0 0 960 520" role="img" aria-label="Memory layout explorer"></svg></div>
<!--CONTROLS-->
<div class="controls">
  <button id="play" class="primary">Play</button>
  <button id="prev" aria-label="previous step">◀ Step</button>
  <button id="next" aria-label="next step">Step ▶</button>
  <button id="reset">Reset</button>
  <label>Speed <input id="speed" type="range" min="0.5" max="6" step="0.5" value="1.5"><span id="speedv"></span></label>
  <div class="progress"><div id="bar"></div></div><span id="count" class="sub" style="margin:0"></span>
  <button id="theme" aria-label="toggle theme">◐</button>
</div>
<div id="caption" class="caption"></div>
<!--END-CONTROLS-->
<script>/*CORE-JS*/
// Animation core: every animation defines STEPS (array of {caption, ...state}) and draw(svg, step, index).
// Controls: play/pause, step back/forward, reset, speed slider, keyboard (space, ←, →, r), theme toggle.
(function () {
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  window.el = function (tag, attrs, parent, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  };
  window.css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  window.startAnimation = function (cfg) {
    const svg = $("#svg");
    let i = 0, playing = false, timer = null;
    const steps = cfg.steps;
    const render = () => {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      cfg.draw(svg, steps[i], i);
      $("#caption").innerHTML = steps[i].caption || "";
      $("#bar").style.width = (100 * i / Math.max(1, steps.length - 1)) + "%";
      $("#count").textContent = (i + 1) + " / " + steps.length;
    };
    const speed = () => +$("#speed").value;           // steps per second
    const tick = () => { if (i < steps.length - 1) { i++; render(); } else pause(); };
    const play = () => { if (i >= steps.length - 1) i = 0; playing = true; $("#play").textContent = "Pause"; schedule(); render(); };
    const schedule = () => { clearTimeout(timer); if (playing) timer = setTimeout(() => { tick(); schedule(); }, 1000 / speed()); };
    const pause = () => { playing = false; clearTimeout(timer); $("#play").textContent = "Play"; };
    $("#play").onclick = () => (playing ? pause() : play());
    $("#next").onclick = () => { pause(); if (i < steps.length - 1) i++; render(); };
    $("#prev").onclick = () => { pause(); if (i > 0) i--; render(); };
    $("#reset").onclick = () => { pause(); i = 0; render(); };
    $("#speed").oninput = () => { $("#speedv").textContent = speed() + "/s"; schedule(); };
    $("#theme").onclick = () => {
      const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
      const cur = r.dataset.theme || (dark ? "dark" : "light");
      r.dataset.theme = cur === "dark" ? "light" : "dark"; render();
    };
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === " ") { e.preventDefault(); $("#play").click(); }
      if (e.key === "ArrowRight") $("#next").click();
      if (e.key === "ArrowLeft") $("#prev").click();
      if (e.key === "r") $("#reset").click();
    });
    window.rerender = render;   // lets an animation re-render after its own inputs change
    window.setSteps = (s) => { pause(); cfg.steps = s; steps.length = 0; s.forEach((x) => steps.push(x)); i = 0; render(); };
    $("#speedv").textContent = speed() + "/s";
    render();
  };
})();
/*END-CORE-JS*/</script>
<div class="controls extra">
  <label>Walk order
    <select id="mode">
      <option value="row">row-major (stride 1)</option>
      <option value="col">column order (stride 8) — like a naive transpose write</option>
      <option value="tile">4×4 tiles (blocked)</option>
    </select></label>
</div>
<div class="legend"><span><i style="background:var(--cell2)"></i>field</span><span><i style="background:var(--cell3)"></i>padding</span><span><i style="background:var(--accent)"></i>current access</span><span><i style="background:var(--cell4)"></i>line in cache</span></div>
<script>
// Part 1: struct Bad {char tag; double value; char flag;} vs struct Good {double value; char tag; char flag;}
const BAD = [["tag",0,1],["pad",1,7],["value",8,8],["flag",16,1],["pad",17,7]];
const GOOD = [["value",0,8],["tag",8,1],["flag",9,1],["pad",10,6]];
function structSteps() {
  const s = [];
  s.push({kind:"struct", which:"bad", upto:0, caption:"<b>struct Bad</b> { char tag; double value; char flag; }: <code>tag</code> takes byte 0."});
  s.push({kind:"struct", which:"bad", upto:1, caption:"<code>value</code> is a double, so it must start at a multiple of 8. The compiler inserts <b>7 padding bytes</b>."});
  s.push({kind:"struct", which:"bad", upto:2, caption:"<code>value</code> occupies bytes 8–15."});
  s.push({kind:"struct", which:"bad", upto:4, caption:"<code>flag</code> is at byte 16, then 7 bytes of <b>tail padding</b> make sizeof a multiple of 8, so arrays stay aligned. <b>sizeof = 24</b>."});
  s.push({kind:"struct", which:"good", upto:3, caption:"<b>struct Good</b>: the same fields, largest alignment first. 8 + 1 + 1 + 6 tail padding = <b>16 bytes</b>, 33% smaller. Every array of these pays the difference per element."});
  return s;
}
// Part 2: an 8x8 float matrix, cache lines of 8 floats (32 B, scaled down for display), LRU cache of 4 lines.
const N = 8, LINE = 8, CACHE = 4;
function order(mode) {
  const o = [];
  if (mode === "row") for (let i=0;i<N;i++) for (let j=0;j<N;j++) o.push([i,j]);
  if (mode === "col") for (let j=0;j<N;j++) for (let i=0;i<N;i++) o.push([i,j]);
  if (mode === "tile") for (let ti=0;ti<N;ti+=4) for (let tj=0;tj<N;tj+=4) for (let i=ti;i<ti+4;i++) for (let j=tj;j<tj+4;j++) o.push([i,j]);
  return o;
}
function walkSteps(mode) {
  const s = []; let cache = [], misses = 0;
  order(mode).forEach(([i,j], k) => {
    const addr = i*N + j, line = Math.floor(addr / LINE);
    const hit = cache.includes(line);
    if (hit) cache = cache.filter(x => x !== line); else { misses++; if (cache.length === CACHE) cache.shift(); }
    cache.push(line);
    s.push({kind:"walk", i, j, addr, line, hit, cache:[...cache], misses, k,
      caption:`Access (${i},${j}), offset ${i}×8+${j} = ${addr}, in line ${line}: <b style="color:var(--${hit?"ok":"bad"})">${hit?"hit":"miss"}</b>. Misses so far: <b>${misses}</b> / ${k+1} accesses.` +
      (k === 63 ? (mode==="row" ? " Row-major touches each line once: <b>8 misses</b>, the minimum." : mode==="col" ? " A stride of 8 means every access is a new line, and the 4-line cache can't hold a whole column of lines. <b>64 misses</b>: every byte fetched is used once, then evicted." : " Tiles reuse each line while it is still cached. Far fewer misses than column order.") : "")});
  });
  return s;
}
function allSteps() { return structSteps().concat(walkSteps(document.getElementById("mode").value)); }

function draw(svg, st) {
  if (st.kind === "struct") {
    const layout = st.which === "bad" ? BAD : GOOD, total = st.which === "bad" ? 24 : 16;
    el("text", {x:20, y:40, "font-size":18}, svg, st.which === "bad" ? "struct Bad (24 bytes)" : "struct Good (16 bytes)");
    for (let b=0;b<24;b++) {
      const x = 20 + b*38, y = 70;
      let fill = css("--cell"), label = "";
      layout.forEach(([name, off, len], idx) => { if (b>=off && b<off+len && idx<=st.upto) { fill = name==="pad" ? css("--cell3") : css("--cell2"); label = name==="pad" ? "·" : (b===off ? name : ""); }});
      if (b >= total) fill = "none";
      el("rect", {x, y, width:34, height:60, rx:4, fill, stroke: b<total ? css("--line") : "none"}, svg);
      if (b < total) el("text", {x:x+17, y:y+80, "text-anchor":"middle", "font-size":11, class:"muted"}, svg, b);
      if (label) el("text", {x:x+4, y:y+36, "font-size":12}, svg, label);
    }
    [0,8,16].forEach(b => el("line", {x1:20+b*38-2, y1:60, x2:20+b*38-2, y2:140, stroke:css("--accent"), "stroke-dasharray":"4 3"}, svg));
    el("text", {x:20, y:190, class:"muted", "font-size":13}, svg, "Dashed lines = 8-byte boundaries. A double must start on one.");
    return;
  }
  // matrix view
  const ox = 40, oy = 40, c = 40;
  el("text", {x:ox, y:oy-12, "font-size":14}, svg, "logical 8×8 matrix (row-major storage)");
  for (let i=0;i<N;i++) for (let j=0;j<N;j++) {
    const addr = i*N+j, line = Math.floor(addr/LINE);
    let fill = st.cache.includes(line) ? css("--cell4") : css("--cell");
    if (i===st.i && j===st.j) fill = css("--accent");
    el("rect", {x:ox+j*c, y:oy+i*c, width:c-4, height:c-4, rx:4, fill, stroke:css("--line")}, svg);
    el("text", {x:ox+j*c+18, y:oy+i*c+23, "text-anchor":"middle", "font-size":11}, svg, addr);
  }
  // memory strip, one line per row
  const mx = 420;
  el("text", {x:mx, y:oy-12, "font-size":14}, svg, "memory: 8 cache lines × 8 floats");
  for (let l=0;l<8;l++) {
    el("text", {x:mx, y:oy+l*c+23, "font-size":12, class:"muted"}, svg, "line " + l);
    for (let k=0;k<LINE;k++) {
      const addr = l*LINE+k;
      let fill = st.cache.includes(l) ? css("--cell4") : css("--cell");
      if (addr === st.addr) fill = css("--accent");
      el("rect", {x:mx+60+k*44, y:oy+l*c, width:40, height:c-4, rx:3, fill, stroke:css("--line")}, svg);
      el("text", {x:mx+80+k*44, y:oy+l*c+23, "text-anchor":"middle", "font-size":11}, svg, addr);
    }
  }
  el("text", {x:ox, y:oy+N*c+30, "font-size":14}, svg, `cache (LRU, ${CACHE} lines): [${st.cache.join(", ")}]   misses: ${st.misses}`);
}
startAnimation({steps: allSteps(), draw});
document.getElementById("mode").onchange = () => setSteps(allSteps());
</script>
</main>
</body>
</html>
