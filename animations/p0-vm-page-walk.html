<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual address → physical page</title>
<style>/*CORE-CSS*/
:root{--bg:#ffffff;--fg:#1d2433;--muted:#5b6578;--panel:#f3f5f9;--line:#d5dbe5;--accent:#2563eb;--accent2:#d9480f;--ok:#2f9e44;--bad:#c92a2a;--warn:#e8a200;--cell:#e7ecf5;--cell2:#cfe0ff;--cell3:#ffd8c2;--cell4:#d3f9d8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151c;--fg:#e6e9ef;--muted:#9aa4b5;--panel:#1a2029;--line:#2e3846;--accent:#6ea8fe;--accent2:#ff922b;--ok:#69db7c;--bad:#ff6b6b;--warn:#ffd43b;--cell:#232b37;--cell2:#1f3a66;--cell3:#5c2e14;--cell4:#1f4d2a;}}
:root[data-theme="dark"]{--bg:#11151c;--fg:#e6e9ef;--muted:#9aa4b5;--panel:#1a2029;--line:#2e3846;--accent:#6ea8fe;--accent2:#ff922b;--ok:#69db7c;--bad:#ff6b6b;--warn:#ffd43b;--cell:#232b37;--cell2:#1f3a66;--cell3:#5c2e14;--cell4:#1f4d2a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:hidden}
.stage svg{width:100%;height:auto;display:block}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
label{display:flex;align-items:center;gap:6px;color:var(--muted)}
input[type=range]{width:120px}
.progress{flex:1 1 120px;height:6px;background:var(--line);border-radius:3px;min-width:80px}
.progress>div{height:100%;background:var(--accent);border-radius:3px;width:0}
.caption{min-height:3.2em;background:var(--panel);border-left:4px solid var(--accent);padding:8px 12px;border-radius:6px}
.extra{margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:.9rem;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
svg text{fill:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
svg .muted{fill:var(--muted)}
.kbd{font-family:ui-monospace,monospace;font-size:.85em;border:1px solid var(--line);border-radius:4px;padding:0 4px}
/*END-CORE-CSS*/</style>
</head>
<body>
<main>
<h1>Virtual address → physical page</h1>
<p class="sub">P0.2 — how one load is translated: TLB lookup, 4-level page walk on a miss, and a page fault on the first touch of an mmap'd file.</p>
<div class="stage"><svg id="svg" viewBox="0 0 960 520" role="img" aria-label="Virtual address → physical page"></svg></div>
<!--CONTROLS-->
<div class="controls">
  <button id="play" class="primary">Play</button>
  <button id="prev" aria-label="previous step">◀ Step</button>
  <button id="next" aria-label="next step">Step ▶</button>
  <button id="reset">Reset</button>
  <label>Speed <input id="speed" type="range" min="0.5" max="6" step="0.5" value="1.5"><span id="speedv"></span></label>
  <div class="progress"><div id="bar"></div></div><span id="count" class="sub" style="margin:0"></span>
  <button id="theme" aria-label="toggle theme">◐</button>
</div>
<div id="caption" class="caption"></div>
<!--END-CONTROLS-->
<script>/*CORE-JS*/
// Animation core: every animation defines STEPS (array of {caption, ...state}) and draw(svg, step, index).
// Controls: play/pause, step back/forward, reset, speed slider, keyboard (space, ←, →, r), theme toggle.
(function () {
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  window.el = function (tag, attrs, parent, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  };
  window.css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  window.startAnimation = function (cfg) {
    const svg = $("#svg");
    let i = 0, playing = false, timer = null;
    const steps = cfg.steps;
    const render = () => {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      cfg.draw(svg, steps[i], i);
      $("#caption").innerHTML = steps[i].caption || "";
      $("#bar").style.width = (100 * i / Math.max(1, steps.length - 1)) + "%";
      $("#count").textContent = (i + 1) + " / " + steps.length;
    };
    const speed = () => +$("#speed").value;           // steps per second
    const tick = () => { if (i < steps.length - 1) { i++; render(); } else pause(); };
    const play = () => { if (i >= steps.length - 1) i = 0; playing = true; $("#play").textContent = "Pause"; schedule(); render(); };
    const schedule = () => { clearTimeout(timer); if (playing) timer = setTimeout(() => { tick(); schedule(); }, 1000 / speed()); };
    const pause = () => { playing = false; clearTimeout(timer); $("#play").textContent = "Play"; };
    $("#play").onclick = () => (playing ? pause() : play());
    $("#next").onclick = () => { pause(); if (i < steps.length - 1) i++; render(); };
    $("#prev").onclick = () => { pause(); if (i > 0) i--; render(); };
    $("#reset").onclick = () => { pause(); i = 0; render(); };
    $("#speed").oninput = () => { $("#speedv").textContent = speed() + "/s"; schedule(); };
    $("#theme").onclick = () => {
      const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
      const cur = r.dataset.theme || (dark ? "dark" : "light");
      r.dataset.theme = cur === "dark" ? "light" : "dark"; render();
    };
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === " ") { e.preventDefault(); $("#play").click(); }
      if (e.key === "ArrowRight") $("#next").click();
      if (e.key === "ArrowLeft") $("#prev").click();
      if (e.key === "r") $("#reset").click();
    });
    window.rerender = render;   // lets an animation re-render after its own inputs change
    window.setSteps = (s) => { pause(); cfg.steps = s; steps.length = 0; s.forEach((x) => steps.push(x)); i = 0; render(); };
    $("#speedv").textContent = speed() + "/s";
    render();
  };
})();
/*END-CORE-JS*/</script>
<div class="legend"><span><i style="background:var(--accent)"></i>active</span><span><i style="background:var(--cell4)"></i>hit / present</span><span><i style="background:var(--cell3)"></i>miss / not present</span></div>
<script>
// Three loads: (A) heap address, cold TLB; (B) same page, TLB hit; (C) mmap'd file page, never touched -> fault.
const A = 0x7f3a12345678, B = 0x7f3a12345ab0, Cva = 0x7f3a40001010;
const idx = (va) => [(va / 2**39) & 511, (va / 2**30) & 511, (va / 2**21) & 511, (va / 2**12) & 511, va & 0xfff].map(Math.floor);
const hex = (v) => "0x" + v.toString(16).padStart(12, "0");
const S = (o) => Object.assign({va:A, active:"", tlb:[], walk:-1, frameA:false, frameC:false, fault:false, cache:"", disk:false}, o);
const STEPS = [
  S({active:"va", caption:"A load from <b>" + hex(A) + "</b>. The CPU only knows this virtual address. Its 48 bits split into four 9-bit table indices and a 12-bit page offset."}),
  S({active:"tlb", caption:"Step 1: look the virtual page number up in the <b>TLB</b>. The TLB is cold, so this is a <b>miss</b>."}),
  S({active:"walk", walk:0, caption:"Step 2: page walk. CR3 points at the PML4 table, and index " + idx(A)[0] + " selects the next table. That is one memory read."}),
  S({active:"walk", walk:1, caption:"PDPT[" + idx(A)[1] + "] is the second dependent read."}),
  S({active:"walk", walk:2, caption:"PD[" + idx(A)[2] + "] is the third read."}),
  S({active:"walk", walk:3, frameA:true, caption:"PT[" + idx(A)[3] + "] holds the physical <b>frame number</b>, the fourth read. The frame + the offset 0x" + idx(A)[4].toString(16) + " gives the physical address. Four reads happened before the data read."}),
  S({active:"tlb", tlb:["A"], frameA:true, caption:"The translation is cached in the TLB. The load completes."}),
  S({va:B, active:"tlb", tlb:["A"], frameA:true, caption:"Next load " + hex(B) + ": same 4 KiB page, so a <b>TLB hit</b>. No walk is needed. This is why sequential access is cheap."}),
  S({va:Cva, active:"va", tlb:["A"], frameA:true, caption:"Now a load from a page of a file we <code>mmap</code>'d but never touched (" + hex(Cva) + ")."}),
  S({va:Cva, active:"walk", walk:3, tlb:["A"], frameA:true, fault:true, caption:"TLB miss, then the walk reaches a PT entry marked <b>not present</b>. <code>mmap</code> only reserved virtual space. The CPU raises a <b>page fault</b>."}),
  S({va:Cva, active:"kernel", tlb:["A"], frameA:true, fault:true, cache:"lookup", caption:"The kernel's fault handler looks for this file page in the <b>page cache</b>."}),
  S({va:Cva, active:"kernel", tlb:["A"], frameA:true, fault:true, cache:"miss", disk:true, caption:"Not cached, so this is a <b>major fault</b>: read 4 KiB (plus readahead) from disk. If it had been cached, this would be a cheap <b>minor fault</b> instead."}),
  S({va:Cva, active:"walk", walk:3, tlb:["A"], frameA:true, frameC:true, cache:"hit", caption:"The page is now in the page cache. The kernel points the PT entry at that frame and returns. The instruction <b>retries</b>."}),
  S({va:Cva, active:"tlb", tlb:["A","C"], frameA:true, frameC:true, cache:"hit", caption:"The retry walks successfully and fills the TLB. Every later touch of this page is free. That is why the second pass over an mmap'd file shows ~0 faults."}),
];
function box(svg, x, y, w, h, fill, label, sub) {
  el("rect", {x, y, width:w, height:h, rx:8, fill, stroke:css("--line")}, svg);
  el("text", {x:x+w/2, y:y+h/2-(sub?4:-5), "text-anchor":"middle", "font-size":14}, svg, label);
  if (sub) el("text", {x:x+w/2, y:y+h/2+14, "text-anchor":"middle", "font-size":11, class:"muted"}, svg, sub);
}
function draw(svg, s) {
  const I = idx(s.va), act = (k) => s.active === k ? css("--accent") : css("--cell");
  // VA fields
  const names = ["PML4","PDPT","PD","PT","offset"], widths = [9,9,9,9,12];
  let x = 20;
  el("text", {x:20, y:28, "font-size":15}, svg, "virtual address " + hex(s.va));
  names.forEach((n, k) => {
    const w = widths[k] * 13;
    box(svg, x, 40, w-4, 52, s.active==="va" ? css("--cell2") : (s.walk===k ? css("--accent") : css("--cell")), n, k<4 ? "index " + I[k] : "0x" + I[4].toString(16));
    x += w;
  });
  // TLB
  box(svg, 20, 130, 220, 110, act("tlb"), "TLB", s.tlb.length ? "entries: " + s.tlb.map(t => "page " + t).join(", ") : "empty");
  // walk tables
  ["PML4","PDPT","PD","PT"].forEach((n, k) => {
    let fill = css("--cell");
    if (s.walk >= k && s.active === "walk") fill = (k === 3 && s.fault) ? css("--cell3") : css("--cell4");
    if (s.walk === k && s.active === "walk" && !(k===3 && s.fault)) fill = css("--accent");
    box(svg, 280 + k*120, 130, 105, 110, fill, n + " table", "[" + I[k] + "]");
    if (k < 3) el("line", {x1:280+k*120+105, y1:185, x2:280+(k+1)*120, y2:185, stroke:css("--muted"), "marker-end":"url(#arr)"}, svg);
  });
  const defs = el("defs", {}, svg), m = el("marker", {id:"arr", viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:7, markerHeight:7, orient:"auto"}, defs);
  el("path", {d:"M0,0 L10,5 L0,10 z", fill:css("--muted")}, m);
  // physical memory
  el("text", {x:20, y:290, "font-size":15}, svg, "physical memory (frames)");
  for (let f=0; f<10; f++) {
    let fill = css("--cell"), lab = "";
    if (f === 3 && s.frameA) { fill = css("--cell4"); lab = "page A"; }
    if (f === 7 && s.frameC) { fill = css("--cell4"); lab = "file pg"; }
    el("rect", {x:20+f*62, y:300, width:56, height:56, rx:5, fill, stroke:css("--line")}, svg);
    el("text", {x:48+f*62, y:333, "text-anchor":"middle", "font-size":11}, svg, lab);
  }
  // kernel / page cache / disk
  box(svg, 700, 130, 240, 110, s.active==="kernel" ? css("--accent") : (s.fault ? css("--cell3") : css("--cell")), s.fault ? "PAGE FAULT → kernel" : "kernel", s.fault ? "fault handler" : "idle");
  box(svg, 700, 300, 110, 90, s.cache==="hit" ? css("--cell4") : s.cache ? css("--cell3") : css("--cell"), "page cache", s.cache || "");
  box(svg, 830, 300, 110, 90, s.disk ? css("--accent") : css("--cell"), "disk", s.disk ? "reading…" : "");
  el("text", {x:20, y:420, class:"muted", "font-size":13}, svg, "Each table is one 4 KiB page of 512 entries, so 9 index bits per level. A walk is 4 dependent reads.");
}
startAnimation({steps: STEPS, draw});
</script>
</main>
</body>
</html>
