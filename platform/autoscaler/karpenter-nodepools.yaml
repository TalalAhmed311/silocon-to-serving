# Karpenter NodePools for GPU capacity: prefer spot, fall back to on-demand (Karpenter picks the cheapest launchable
# offering among the allowed capacity types; weights order pools). API version/fields per karpenter.sh docs — UNVERIFIED;
# check the version you install. Requires Karpenter installed instead of (or alongside) the managed GPU node group.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: gpu-spot }
spec:
  weight: 100                       # tried first
  template:
    metadata: { labels: { s2s/pool: gpu } }
    spec:
      taints: [{ key: nvidia.com/gpu, value: present, effect: NoSchedule }]
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["spot"] }
        - { key: node.kubernetes.io/instance-type, operator: In, values: ["g6.xlarge", "g6.2xlarge", "g5.xlarge"] }
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu }
      expireAfter: 168h
  limits: { nvidia.com/gpu: 4 }
  disruption: { consolidationPolicy: WhenEmpty, consolidateAfter: 10m }
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: gpu-on-demand }
spec:
  weight: 10                        # fallback when spot is unavailable
  template:
    metadata: { labels: { s2s/pool: gpu } }
    spec:
      taints: [{ key: nvidia.com/gpu, value: present, effect: NoSchedule }]
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
        - { key: node.kubernetes.io/instance-type, operator: In, values: ["g6.xlarge"] }
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu }
  limits: { nvidia.com/gpu: 2 }
  disruption: { consolidationPolicy: WhenEmpty, consolidateAfter: 10m }
