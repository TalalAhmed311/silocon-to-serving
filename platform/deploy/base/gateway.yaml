# #6 gateway in the cluster: 2 replicas (key rotation and rolling updates without downtime, P3.8), ClusterIP only.
# Config comes from the `gateway-config` ConfigMap each overlay generates (tenants are key HASHES, so the ConfigMap
# holds no secrets); backend API keys come from the vllm-api-key Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: s2s
  labels: { app: gateway }
spec:
  replicas: 2
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: s2s-platform:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway.app:app", "--app-dir", "platform", "--host", "0.0.0.0", "--port", "9000"]
          env:
            - { name: GATEWAY_CONFIG, value: /config/gateway.yaml }
            - name: S2S_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key, optional: true } }
          ports: [{ name: http, containerPort: 9000 }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: gateway-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: s2s
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 9000, targetPort: http }]
