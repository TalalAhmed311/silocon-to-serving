# mockllm: a stand-in "GPU" backend for kind (T0). Same probes, taints and security posture as vllm.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockllm
  namespace: s2s
  labels: { app: mockllm }
spec:
  replicas: 2
  selector:
    matchLabels: { app: mockllm }
  template:
    metadata:
      labels: { app: mockllm }
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector: { s2s/pool: gpu }
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mockllm
          image: s2s-platform:dev          # docker build -f env/Dockerfile.platform -t s2s-platform:dev . && kind load docker-image s2s-platform:dev --name s2s
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "mockllm.server:app", "--app-dir", "platform", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - { name: MOCKLLM_MAX_NUM_SEQS, value: "16" }
          ports: [{ name: http, containerPort: 8001 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mockllm
  namespace: s2s
spec:
  selector: { app: mockllm }
  ports: [{ name: http, port: 8001, targetPort: http }]
