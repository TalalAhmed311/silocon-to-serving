apiVersion: v1
kind: ServiceAccount
metadata:
  name: failover-prober
  namespace: s2s
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/s2s-failover-prober   # REPLACE (PutMetricData only)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failover-prober
  namespace: s2s
  labels: { app: failover-prober }
spec:
  replicas: 1
  selector: { matchLabels: { app: failover-prober } }
  template:
    metadata: { labels: { app: failover-prober } }
    spec:
      serviceAccountName: failover-prober
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prober
          image: s2s-platform:dev
          command: ["python", "-m", "failover.prober", "--url", "http://gateway.s2s:9000",
                    "--region", "REGION", "--interval-s", "10", "--timeout-s", "10"]    # REPLACE REGION per cluster
          env:
            - name: S2S_PROBE_KEY
              valueFrom: { secretKeyRef: { name: probe-api-key, key: key } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
