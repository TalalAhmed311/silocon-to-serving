# #11: MIG via the GPU Operator's MIG manager (A100/H100 only). Generated by `python -m partitioning.cli mig ...`
# for a tenant mix; label a node to apply:  kubectl label node <n> nvidia.com/mig.config=s2s-mix --overwrite
# With the "mixed" strategy pods request e.g. nvidia.com/mig-3g.40gb: 1. Profile names per the MIG guide (UNVERIFIED).
apiVersion: v1
kind: ConfigMap
metadata: { name: s2s-mig-config, namespace: gpu-operator }
data:
  config.yaml: |-
    version: v1
    mig-configs:
      s2s-mix:
        - devices: [0]
          mig-enabled: true
          mig-devices: { "3g.40gb": 1, "2g.20gb": 1, "1g.10gb": 2 }
      all-1g:
        - devices: all
          mig-enabled: true
          mig-devices: { "1g.10gb": 7 }
