[project]
name = "silicon-to-serving"
version = "0.1.0"
description = "Course code: references, calculators, simulators, gateway, tests."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "pytest>=8.3",
  "safetensors>=0.5",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "prometheus-client>=0.21",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-api>=1.28",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "pytest-asyncio>=0.24",
  "scipy>=1.14",
]

[project.optional-dependencies]
# Heavier stack: PyTorch (CPU use only in CI), Triton interpreter, HF parity checks.
torch = ["torch>=2.5", "transformers>=4.46", "triton>=3.1"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
markers = [
  "torch: needs the [torch] extra",
  "gpu: needs an NVIDIA GPU (T2)",
  "slow: long-running",
]
asyncio_default_fixture_loop_scope = "function"
